<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/carga_cadastrar.js"defer></script>
    <title>Cadastrar Carga</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
        </nav>
    </header>
    <main>
        <h1>Cadastrar Carga</h1>
        <form>
            <label for="descricao">Descrição:</label><br>
            <input type="text" id="descricao"><br><br>

            <label for="peso">Peso:</label><br>
            <input type="number" id="peso"><br><br>

            <label for="volume">Volume:</label><br>
            <input type="number" id="volume"><br><br>

            <label for="codRastreio">Código de Rastreio:</label><br>
            <input type="text" id="codRastreio"><br><br>

            <label for="idMotorista">Código do Motorista:</label><br>
            <input type="number" id="idMotorista"><br><br>

            <button id="btn_cad">Cadastrar</button>
        </form>
        <div id="res"></div>
    </main>
</body>
</html>
